<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人才发展数据库 · 国际升学与学术研究</title>
<style>
:root{
  --ink:#14201D; --teal:#0F7A66; --teal-l:#1A9B82; --gold:#B8852F; --blue:#2B5D8A;
  --paper:#F7F7F4; --card:#FFFFFF; --line:#E3E9E6; --line2:#EEF3F0;
  --txt:#22312D; --mut:#75857F; --mut2:#9AA8A3; --side:258px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif;
  background:var(--paper);color:var(--txt);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.shell{display:flex;min-height:100vh}
.side{width:var(--side);flex:0 0 var(--side);background:var(--ink);color:#B7C6C1;
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:0 0 24px;display:flex;flex-direction:column}
.side::-webkit-scrollbar{width:6px}
.side::-webkit-scrollbar-thumb{background:#2E443E;border-radius:3px}
.brand{padding:22px 20px 18px;border-bottom:1px solid #24352F}
.brand .logo{color:#fff;font-size:16px;font-weight:700}
.brand .sub{color:#6E857E;font-size:11.5px;margin-top:5px;letter-spacing:.04em}
nav{flex:1;padding:14px 0}
.grp{padding:14px 20px 6px;font-size:10.5px;letter-spacing:.12em;color:#5E746D;font-weight:700}
.grp span{color:#3E544D;font-weight:400;letter-spacing:0;margin-left:6px}
.nav-i{display:flex;align-items:center;gap:9px;padding:8px 20px;cursor:pointer;
  font-size:13px;color:#A8BAB4;border-left:2px solid transparent;transition:background .12s}
.nav-i:hover{background:#1A2A25;color:#DDE8E4}
.nav-i.on{background:rgba(15,122,102,.2);color:#fff;border-left-color:var(--teal-l);font-weight:600}
.nav-i i{font-style:normal;font-size:10.5px;color:#5E746D;width:18px;text-align:right;flex:0 0 18px}
.nav-i.on i{color:var(--teal-l)}
.nav-i b{font-weight:inherit;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-i em{font-style:normal;font-size:10px;color:#4E635C;background:#1E312B;padding:1px 5px;border-radius:3px}
.nav-i.on em{color:#9FD4C8;background:#23443C}
.side-foot{padding:14px 20px 0;border-top:1px solid #24352F;font-size:11px;color:#5E746D;line-height:1.9}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(247,247,244,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:13px 30px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--mut);flex:1;min-width:180px}
.crumb b{color:var(--txt);font-weight:600;font-size:13px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=search],select{font-family:inherit;font-size:12.5px;color:var(--txt);background:#fff;
  border:1px solid var(--line);border-radius:7px;padding:6px 10px;outline:none}
input[type=search]{width:190px}
input[type=search]:focus,select:focus{border-color:var(--teal-l);box-shadow:0 0 0 3px rgba(15,122,102,.08)}
select{cursor:pointer;max-width:220px}
.btn{font-family:inherit;font-size:12.5px;color:var(--teal);background:#fff;border:1px solid var(--line);
  border-radius:7px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--teal-l);background:#F2FAF7}
.count{font-size:12px;color:var(--mut2);white-space:nowrap}
#view{padding:26px 30px 56px;max-width:1560px}
.hero{margin-bottom:22px}
.hero h1{font-size:27px;font-weight:700;letter-spacing:-.01em;color:var(--ink);line-height:1.3}
.hero p{color:var(--mut);font-size:13.5px;margin-top:9px;max-width:980px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin:20px 0 26px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:15px 17px}
.kpi .n{font-size:26px;font-weight:700;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .n small{font-size:13px;font-weight:500;color:var(--mut);margin-left:3px}
.kpi .l{font-size:12px;color:var(--mut);margin-top:6px}
.kpi.g .n{color:var(--teal)} .kpi.o .n{color:var(--gold)} .kpi.b .n{color:var(--blue)}
.sec-t{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.02em;margin:28px 0 12px;
  display:flex;align-items:center;gap:9px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.card h3{font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:3px}
.card .meta{font-size:11.5px;color:var(--mut2);margin-bottom:12px}
.card ul{list-style:none}
.card li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line2);
  font-size:12.5px;color:var(--txt);cursor:pointer}
.card li:hover{color:var(--teal)}
.card li i{font-style:normal;font-size:10.5px;color:var(--mut2);width:16px;flex:0 0 16px;text-align:right}
.card li em{font-style:normal;margin-left:auto;font-size:11px;color:var(--mut2)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.lg{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
.lg .tag{font-size:15px;font-weight:700;margin-bottom:6px}
.lg .tag.g{color:var(--teal)} .lg .tag.o{color:var(--gold)} .lg .tag.b{color:var(--blue)}
.lg .t{font-size:12.5px;color:var(--txt);font-weight:600}
.lg .d{font-size:11.5px;color:var(--mut);margin-top:4px;line-height:1.65}
.verdict{background:#F2FAF7;border:1px solid #C9E7DE;border-left:3px solid var(--teal);
  border-radius:0 9px 9px 0;padding:15px 18px;margin:18px 0}
.verdict h4{font-size:13px;color:#0B6A57;font-weight:700;margin-bottom:7px}
.verdict p{font-size:12.5px;color:#2A423C;line-height:1.8}
.verdict b{color:#0B6A57}
.phead{margin-bottom:16px}
.phead h2{font-size:19px;font-weight:700;color:var(--ink);line-height:1.4}
.phead .pnote{font-size:12px;color:var(--mut);margin-top:8px;padding:10px 13px;background:#FBFCFA;
  border-left:2px solid var(--teal-l);border-radius:0 6px 6px 0;line-height:1.7}
.tbox{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tscroll{overflow:auto;max-height:calc(100vh - 230px)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{position:sticky;top:0;z-index:5;background:#F0F5F2;color:#4C605A;font-size:11.5px;
  font-weight:700;letter-spacing:.03em;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);
  white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{background:#E7F0EC;color:var(--teal)}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top;line-height:1.65}
tbody tr:hover{background:#F6FBF9}
tbody tr:last-child td{border-bottom:none}
td.c1{font-weight:600;color:var(--ink)}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.clamp.open{-webkit-line-clamp:unset;display:block}
td .more{font-size:10.5px;color:var(--teal);cursor:pointer;margin-left:4px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:9px;white-space:nowrap}
.b-ok{background:#E2F3ED;color:#0B6A57}
.b-warn{background:#FBF0DF;color:#95691F}
.b-blue{background:#E7EFF7;color:#25527A}
.b-no{background:#FBE9E7;color:#A63D2F}
.em{color:var(--mut2)}
mark{background:#FFF1B8;color:inherit;padding:0 1px;border-radius:2px}
.empty{padding:48px 20px;text-align:center;color:var(--mut2);font-size:13px}
@media(max-width:1080px){
  :root{--side:210px}
  #view{padding:20px 18px 40px}
  .top{padding:11px 18px}
}
@media(max-width:820px){
  .shell{flex-direction:column}
  .side{width:100%;flex:none;height:auto;position:static;padding-bottom:10px}
  nav{display:flex;overflow-x:auto;padding:8px 12px;gap:4px}
  .grp{display:none}
  .nav-i{border-left:none;border-bottom:2px solid transparent;white-space:nowrap;padding:6px 10px;border-radius:6px}
  .nav-i.on{border-left:none;border-bottom-color:var(--teal-l)}
  .nav-i em{display:none}
  .side-foot{display:none}
  .tscroll{max-height:none}
  input[type=search]{width:130px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo">人才发展数据库</div>

</div>

function currentRows(){
  const t = findTable(S.view);
  if(!t) return [];
  let rows = t.rows.map((r,i) => ({r, i}));
  if(S.fc >= 0 && S.fv !== "") rows = rows.filter(x => x.r[S.fc] === S.fv);
  if(S.q){
    const q = S.q.toLowerCase();
    rows = rows.filter(x => x.r.join(" ").toLowerCase().includes(q));
  }
  if(S.sc >= 0){
    rows.sort((a,b) => {
      const A = a.r[S.sc], B = b.r[S.sc];
      const na = parseFloat(String(A).replace(/[^\d.-]/g,"")), nb = parseFloat(String(B).replace(/[^\d.-]/g,""));
      let c;
      if(!isNaN(na) && !isNaN(nb) && /\d/.test(String(A)) && /\d/.test(String(B))) c = na - nb;
      else c = String(A).localeCompare(String(B), "zh");
      return c * S.sd;
    });
  }
  return rows;
}

  if(!rows.length){
    h += `<tr><td colspan="${t.headers.length}"><div class="empty">没有匹配的记录</div></td></tr>`;
  } else {
    rows.forEach(({r}) => {
      h += "<tr>";
      r.forEach((v, j) => {
        h += isStatus(t.headers[j] || "") ? `<td>${badge(v)}</td>` : cellHTML(v, j === 0);
      });
      h += "</tr>";
    });
  }
  h += `</tbody></table></div></div>`;
  $("#view").innerHTML = h;

  const g = GROUPS.find(x => x[2].includes(S.view));
  $("#crumb").innerHTML = `${g?g[0]:""} / <b>${shortName(S.view)}</b>
    <span class="count" style="margin-left:10px">${rows.length} / ${t.rows.length} 条</span>`;
  $("#csv").style.display = "";

  $("#view").querySelectorAll("thead th").forEach(th => {
    th.onclick = () => {
      const j = +th.dataset.col;
      if(S.sc === j) S.sd = -S.sd; else { S.sc = j; S.sd = 1; }
      renderTable();
    };
  });
  $("#view").querySelectorAll(".more").forEach(el => {
    el.onclick = () => {
      const c = el.previousElementSibling;
      c.classList.toggle("open");
      el.textContent = c.classList.contains("open") ? "收起" : "展开";
    };
  });
}

function render(){ S.view === "overview" ? renderOverview() : renderTable(); }

$("#q").oninput = e => { S.q = e.target.value.trim(); render(); };
$("#fsel").onchange = e => { S.fv = e.target.value; render(); };
$("#csv").onclick = () => {
  const t = findTable(S.view); if(!t) return;
  const rows = currentRows().map(x => x.r);
  const csv = [t.headers, ...rows].map(r =>
    r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(",")).join("\r\n");
  const blob = new Blob(["\ufeff" + csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = t.name + ".csv";
  a.click();
};

const init = location.hash.slice(1);
renderNav();
if(init && (init === "overview" || findTable(init))){ S.view = init; render(); }
else { go("overview"); }
window.addEventListener("hashchange", () => {
  const v = location.hash.slice(1);
  if(v && v !== S.view) go(v);
});
</script>
</body>
</html>
